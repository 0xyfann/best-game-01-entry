<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewarden — Guard the Heartlight</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
         font-family: system-ui, sans-serif; }
  #wrap { text-align: center; }
  canvas { width: min(1280px, 100vw); height: auto; aspect-ratio: 16 / 9;
           background: #16233c; border-radius: 6px; box-shadow: 0 12px 48px rgba(0,0,0,0.55);
           cursor: crosshair; display: block; }
  p.hint { color: rgba(255,255,255,0.55); font-size: 13px; margin: 10px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p class="hint">Tidewarden — WASD move &middot; mouse aim &middot; hold mouse to fire &middot; Space dash &middot; P pause &middot; M mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
